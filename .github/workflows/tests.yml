name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install requests==2.32.3
      - name: Run provider tests
        run: python -m unittest discover -s tests -v
      - name: Check Mini App JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("webapp/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
          inline = [item for item in scripts if item.strip()]
          if not inline:
              raise SystemExit("No inline Mini App script found")
          Path("/tmp/musiclsp-webapp.js").write_text(inline[-1], encoding="utf-8")
          PY
          node --check /tmp/musiclsp-webapp.js
