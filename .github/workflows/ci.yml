name: MusicLSP checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path("webapp/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?![^>]*\\btype=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          scripts += re.findall(r'<script[^>]*type=["\\']text/javascript["\\'][^>]*>(.*?)</script>', html, flags=re.I|re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          pathlib.Path("/tmp/musiclsp-inline.js").write_text("\\n;\\n".join(scripts), encoding="utf-8")
          print(f"Checking {len(scripts)} inline script block(s)")
          PY
          node --check /tmp/musiclsp-inline.js
