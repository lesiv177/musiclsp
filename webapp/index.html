<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MusicLSP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#0E0B18; --panel:#181328; --panel-2:#221a3a; --line:rgba(255,255,255,.09);
  --ink:#F0ECFA; --muted:#9A92B8; --accent:#C6A1FF; --accent-ink:#1A0F2E; --gold:#FFD166;
  --radius:14px; --nav-h:64px; --bar-h:62px;
}
[data-theme="ember"]{--bg:#140E0A;--panel:#211710;--panel-2:#2E2016;--ink:#F7EFE6;--muted:#B49882;--accent:#FF9E4A;--accent-ink:#2A1503;--gold:#FFD9A0;}
[data-theme="aurora"]{--bg:#06141A;--panel:#0D2129;--panel-2:#123039;--ink:#E6F6F8;--muted:#82A8B2;--accent:#5BE3C6;--accent-ink:#042019;--gold:#9AD9FF;}
[data-theme="neon"]{--bg:#10060F;--panel:#1E0C1D;--panel-2:#2C1129;--ink:#FCEAF8;--muted:#B487AC;--accent:#FF5FC8;--accent-ink:#2B0420;--gold:#FFE066;}
[data-theme="paper"]{--bg:#F5F1E8;--panel:#FFFFFF;--panel-2:#EDE7DA;--line:rgba(0,0,0,.1);--ink:#1C1A16;--muted:#6E6759;--accent:#5A4BD6;--accent-ink:#FFFFFF;--gold:#B4841F;}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); overflow-x:hidden;
  padding-top:env(safe-area-inset-top);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.dspl{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
img{max-width:100%;display:block}
a{color:var(--accent)}



/* ── сплеш-екран завантаження ───────────────────────── */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;overflow:hidden;background:
    radial-gradient(90% 60% at 18% 8%,rgba(255,111,176,.16),transparent 55%),
    radial-gradient(80% 55% at 85% 12%,rgba(91,227,198,.14),transparent 55%),
    radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 60%),
    var(--bg);
  transition:opacity .5s ease, visibility .5s ease}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}

/* фонове зображення на весь екран заставки — той самий логотип, сильно
   розмитий і напівпрозорий, щоб фон не був просто градієнтом "нізвідки" */
#splash .splashBg{position:absolute;inset:-20%;z-index:0;pointer-events:none;
  background-repeat:no-repeat;background-position:50% 42%;background-size:70% auto;
  filter:blur(70px) saturate(170%);opacity:.38;transform:scale(1.3)}
#splash>.vinylWrap,#splash>.swordmark,#splash>.seq,#splash>.stext{position:relative;z-index:1}

/* вінілова платівка, що крутиться, + тонарм, що опускається */
#splash .vinylWrap{position:relative;width:230px;height:230px;margin-bottom:6px}
#splash .vinyl{width:100%;height:100%;border-radius:50%;position:relative;
  background:
    repeating-radial-gradient(circle at 50% 50%,
      transparent 0px,transparent 2px,rgba(0,0,0,.35) 3px,rgba(0,0,0,.35) 4px),
    conic-gradient(from 200deg,
      #8B6BFF 0deg,#C6A1FF 90deg,#FF9FD6 180deg,#FFD166 270deg,#8B6BFF 360deg);
  box-shadow:0 18px 44px rgba(120,60,200,.5),inset 0 0 0 1px rgba(255,255,255,.08);
  animation:vinylSpin 2.6s linear infinite;
  animation-play-state:paused}
#splash .vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%,transparent 34%,rgba(8,5,18,.88) 35%),
    conic-gradient(from 210deg,rgba(255,255,255,.22),transparent 25%,transparent 75%,rgba(255,255,255,.12));
  mix-blend-mode:normal}
#splash .vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 30deg,rgba(255,255,255,.35),transparent 12%,transparent 88%,rgba(255,255,255,.2));
  mix-blend-mode:overlay;opacity:.7}
#splash .vinyl.spin{animation-play-state:running}
#splash .vlabel{position:absolute;top:50%;left:50%;width:96px;height:96px;transform:translate(-50%,-50%);
  border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px #0b0716,0 0 0 5px rgba(255,255,255,.14);z-index:2;
  background:radial-gradient(circle,#1b1330 0%,#150f26 70%);display:grid;place-items:center}
#splash .vlabelText{position:absolute;inset:0;width:100%;height:100%}
#splash .vlabel img{width:68px;height:68px;object-fit:cover;border-radius:50%;position:relative;z-index:2;
  box-shadow:0 0 0 2px rgba(255,255,255,.18)}
/* дірка шпинделя тепер ПІД лого (z-index нижче за img), інакше вона
   вирізає діру просто посеред логотипу — раніше саме так і було */
#splash .vhole{position:absolute;top:50%;left:50%;width:9px;height:9px;transform:translate(-50%,-50%);
  border-radius:50%;background:#0b0716;box-shadow:0 0 0 2px rgba(255,255,255,.35);z-index:0}
#splash .tonearm{position:absolute;top:-16px;right:-8px;width:94px;height:94px;
  transform-origin:88% 12%;transform:rotate(-32deg);transition:transform .55s cubic-bezier(.34,1.4,.5,1);z-index:4}
#splash .tonearm.down{transform:rotate(-3deg)}
#splash .tonearm i{position:absolute;top:6px;right:10px;width:7px;height:68px;border-radius:4px;
  background:linear-gradient(180deg,#cfc4ea,#8f82ad);transform:rotate(18deg);transform-origin:top center}
#splash .tonearm b{position:absolute;top:0;right:2px;width:19px;height:19px;border-radius:50%;
  background:#cfc4ea;box-shadow:0 2px 6px rgba(0,0,0,.4)}

#splash .swordmark{width:min(52vw,190px);height:auto;filter:drop-shadow(0 4px 18px rgba(140,100,255,.3))}

/* еквалайзер-«живчик» замість сухого прогрес-бару */
#splash .seq{display:flex;align-items:flex-end;gap:5px;height:22px}
#splash .seq i{display:block;width:5px;border-radius:3px;
  background:linear-gradient(180deg,var(--accent),#8B6BFF);
  animation:eqBounce 1s ease-in-out infinite}
#splash .seq i:nth-child(1){animation-delay:-.9s}
#splash .seq i:nth-child(2){animation-delay:-.6s}
#splash .seq i:nth-child(3){animation-delay:-1.1s}
#splash .seq i:nth-child(4){animation-delay:-.35s}
#splash .seq i:nth-child(5){animation-delay:-.75s}

#splash .stext{font-size:13.5px;color:var(--muted);letter-spacing:.02em;min-height:18px;
  transition:opacity .25s ease}
#splash .stext.fade{opacity:0}

@keyframes vinylSpin{to{transform:rotate(360deg)}}
@keyframes eqBounce{0%,100%{height:6px}50%{height:22px}}
.app{max-width:560px;margin:0 auto;min-height:100dvh;
  padding-bottom:calc(var(--nav-h) + var(--bar-h) + 16px + env(safe-area-inset-bottom));
  visibility:hidden;opacity:0}
.app.ready{visibility:visible;opacity:1;transition:opacity .4s ease .05s}

  box-shadow:0 2px 10px rgba(120,80,255,.35)}
.mark span{display:none}
.top .name{font-size:17px;font-weight:700}
.top .sub{font-size:11px;color:var(--muted);margin-top:1px}
.spacer{flex:1}
.chip{font-size:11px;font-weight:600;padding:5px 11px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted)}
.chip.pro{background:var(--gold);color:#241800;border-color:transparent}

/* ── layout ──────────────────────────────────────── */
.screen{display:none;padding:16px 18px 8px}
.screen.on{display:block}
.sect{margin-bottom:26px}
.sect h2{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;
  align-items:center;justify-content:space-between}
.sect h2 .more{font-size:12px;color:var(--muted);font-weight:500}

/* ── search ──────────────────────────────────────── */
.searchbar{display:flex;gap:9px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:12px}
.searchbar input{flex:1;font-size:15px}
.searchbar input::placeholder{color:var(--muted)}
.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted);flex:none}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}

/* ── track rows ──────────────────────────────────── */
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:11px;
  transition:background .15s}
.row:active{background:var(--panel)}
.row.now{background:var(--panel)}
.art{width:48px;height:48px;border-radius:9px;flex:none;object-fit:cover;
  background:var(--panel-2)}
.row .meta{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.row.now .t{color:var(--accent)}
.row .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:2px}
.row .act{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--muted);font-size:17px}
.row .act:active{background:var(--panel-2)}

/* ── horizontal cards ────────────────────────────── */
.reel{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;
  margin:0 -18px;padding:0 18px 4px}
.reel::-webkit-scrollbar{display:none}
.card{width:136px;flex:none}
.card img,.card .ph{width:136px;height:136px;border-radius:12px;object-fit:cover;
  background:var(--panel-2);margin-bottom:8px}
.card .t{font-size:13px;font-weight:500;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

.genres{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.genre{padding:16px 14px;border-radius:12px;font-weight:600;font-size:14px;
  background:var(--panel);border:1px solid var(--line);text-align:left}

/* ── player bar ──────────────────────────────────── */
.bar{position:fixed;left:0;right:0;z-index:40;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;display:none;align-items:center;gap:11px;
  padding:9px 12px;background:var(--panel);border-top:1px solid var(--line);
  border-bottom:1px solid var(--line)}
.bar.on{display:flex}
.bar .art{width:44px;height:44px;border-radius:8px}
.bar .meta{flex:1;min-width:0}
.bar .t{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.bar .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:1px}
.iconbtn{width:38px;height:38px;border-radius:99px;display:grid;place-items:center;
  font-size:18px;flex:none}
.iconbtn.main{background:var(--accent);color:var(--accent-ink)}
.barline{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);
  width:0;transition:width .25s linear}

/* ── bottom nav ──────────────────────────────────── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;max-width:560px;margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:500;
  position:relative;transition:color .2s}
.nav button .ic{font-size:19px;line-height:1;transition:transform .32s cubic-bezier(.4,1.8,.5,1)}
.nav button.on{color:var(--accent)}
.nav button.on .ic{transform:translateY(-2px) scale(1.14)}
.nav button.bump .ic{animation:navBump .38s cubic-bezier(.4,1.8,.5,1)}
.nav button::after{content:"";position:absolute;top:6px;left:50%;width:5px;height:5px;
  border-radius:99px;background:var(--accent);opacity:0;transform:translate(-50%,-6px) scale(.4);
  transition:opacity .2s,transform .25s}
.nav button.on::after{opacity:1;transform:translate(-50%,0) scale(1)}
.nav button:active{transform:scale(.94)}
@keyframes navBump{0%{transform:translateY(-2px) scale(1.14)}40%{transform:translateY(-6px) scale(1.28)}
  100%{transform:translateY(-2px) scale(1.14)}}

/* ── now playing sheet ───────────────────────────── */
.sheet{position:fixed;inset:0;z-index:70;background:var(--bg);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.3,.8,.3,1);
  overflow-y:auto;padding:env(safe-area-inset-top) 20px
  calc(28px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.sheet .handle{width:40px;height:4px;border-radius:9px;background:var(--line);
  margin:12px auto 18px}
.coverWrap{position:relative;width:min(78vw,320px);margin:0 auto 26px}
.heartBurst{position:absolute;font-size:64px;pointer-events:none;z-index:5;
  transform:translate(-50%,-50%) scale(.4);opacity:0;
  animation:heartBurst .7s cubic-bezier(.2,1.4,.4,1) forwards;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4))}
@keyframes heartBurst{
  0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
  30%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
  55%{transform:translate(-50%,-50%) scale(.95);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0}
}
.ambientBg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);
  object-fit:cover;filter:blur(38px) saturate(1.4) brightness(.7);opacity:.5;
  border-radius:24px;z-index:0;pointer-events:none;transition:opacity .4s}
.coverWrap.playing .ambientBg{animation:ambientPulse 6s ease-in-out infinite}
@keyframes ambientPulse{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.09) rotate(2deg)}}
.cover{position:relative;z-index:1;width:100%;aspect-ratio:1;border-radius:18px;display:block;
  object-fit:cover;background:var(--panel-2);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.coverWrap.style-vinyl .cover{border-radius:50%}
.coverWrap.style-vinyl.playing .cover{animation:vinylSpin 9s linear infinite}
@keyframes vinylSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.vinylHole{display:none}
.coverWrap.style-vinyl .vinylHole{display:block;position:absolute;z-index:2;left:50%;top:50%;
  width:13%;height:13%;border-radius:50%;background:var(--bg);
  border:3px solid var(--panel-2);transform:translate(-50%,-50%)}
.particle{position:absolute;border-radius:50%;background:var(--accent);opacity:.3;
  filter:blur(3px);pointer-events:none;z-index:0}
.coverWrap.style-particles.playing .particle{animation:floatParticle 7s ease-in-out infinite}
@keyframes floatParticle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.3)}}
.sheet .tt{font-size:22px;font-weight:700;text-align:center;line-height:1.25}
.sheet .aa{font-size:15px;color:var(--muted);text-align:center;margin-top:6px}
.lic{text-align:center;font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.6}
.lic a{text-decoration:none;border-bottom:1px solid var(--line)}
.seek{margin:26px 0 8px;position:relative}
.bkmkBtn{position:absolute;right:0;top:-30px;background:none;border:none;color:var(--muted);
  font-size:17px;line-height:1;cursor:pointer;padding:4px 2px;opacity:.8}
.bkmkBtn:active{opacity:1;transform:scale(.92)}
.bkmkTicks{position:relative;height:0}
.bkmkTicks i{position:absolute;top:-13px;width:2px;height:6px;border-radius:2px;
  background:var(--gold);opacity:.85;cursor:pointer}
.seek input{width:100%;-webkit-appearance:none;height:4px;border-radius:9px;
  background:var(--panel-2)}
.seek input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  border-radius:99px;background:var(--accent)}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;justify-content:center;gap:20px;margin:22px 0 8px}
.controls .big{width:66px;height:66px;font-size:26px}
.controls .sm{font-size:22px;color:var(--muted)}
.controls .sm.on{color:var(--accent)}
.sheetacts{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.pill{font-size:12.5px;font-weight:500;padding:9px 15px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted)}
.pill.on{color:var(--accent);border-color:var(--accent)}

/* ── modal ───────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:none;
  align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{width:100%;max-width:560px;background:var(--panel);
  border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:82vh;overflow-y:auto}
.modal h3{font-size:17px;margin-bottom:16px}
.field{width:100%;background:var(--panel-2);border:1px solid var(--line);
  border-radius:11px;padding:12px 14px;font-size:15px;margin-bottom:11px}
.btn{width:100%;padding:13px;border-radius:11px;font-weight:600;font-size:14.5px;
  background:var(--accent);color:var(--accent-ink);margin-top:6px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}

/* ── settings ────────────────────────────────────── */
.opt{display:flex;align-items:center;justify-content:between;gap:14px;padding:14px 0;
  border-bottom:1px solid var(--line)}
.opt .lbl{flex:1}
.opt .lbl b{font-size:14.5px;font-weight:500;display:block}
.opt .lbl span{font-size:12px;color:var(--muted);display:block;margin-top:3px;line-height:1.45}
.sw{width:46px;height:27px;border-radius:99px;background:var(--panel-2);flex:none;
  position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;
  border-radius:99px;background:var(--ink);transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(19px);background:var(--accent-ink)}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatch{width:42px;height:42px;border-radius:11px;border:2px solid transparent}
.swatch.on{border-color:var(--ink)}
.eqrow{display:flex;gap:6px;justify-content:space-between;align-items:flex-end;
  height:120px;margin:14px 0}
.eqband{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.eqband input{-webkit-appearance:slider-vertical;width:100%;flex:1}
.eqband span{font-size:9px;color:var(--muted)}

/* ── misc ────────────────────────────────────────── */
.empty{text-align:center;padding:46px 24px;color:var(--muted);font-size:13.5px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:7px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--bar-h) + 26px);
  transform:translateX(-50%) translateY(14px);z-index:100;background:var(--panel-2);
  border:1px solid var(--line);padding:11px 18px;border-radius:99px;font-size:13px;
  opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{height:56px;border-radius:11px;background:var(--panel);margin-bottom:6px;
  animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.85}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.statbox{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}
.statbox div{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:15px 11px;text-align:center}
.statbox b{display:block;font-size:21px;font-family:"Space Grotesk";font-weight:700}
.statbox span{font-size:11px;color:var(--muted);margin-top:3px;display:block}
.feat{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.feat .n{width:24px;height:24px;border-radius:7px;background:var(--panel-2);flex:none;
  display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--accent)}
.feat b{font-size:14px;font-weight:600;display:block}
.feat span{font-size:12.5px;color:var(--muted);display:block;margin-top:3px;line-height:1.45}

/* ── icons ───────────────────────────────────────── */
.icon{width:1em;height:1em;display:inline-block;vertical-align:-0.15em}
.icon.sm{width:16px;height:16px}
.icon.md{width:20px;height:20px}
.icon.lg{width:26px;height:26px}
.act .icon,.iconbtn .icon{width:19px;height:19px}
.iconbtn.main .icon,.controls .big .icon{width:26px;height:26px}
.controls .sm .icon{width:22px;height:22px}
.nav button .ic{font-size:0;display:block}
.nav button .ic .icon{width:21px;height:21px}
.pill{display:inline-flex;align-items:center;gap:6px}
.pill .icon{width:15px;height:15px}
#btnRepeat{position:relative}
#btnRepeat.one::after{content:"1";position:absolute;top:-2px;right:-2px;font-size:8px;
  font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:99px;
  width:12px;height:12px;display:flex;align-items:center;justify-content:center}

/* ── advanced search filters ────────────────────── */
#qFilters{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.frow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.fchip{white-space:nowrap;font-size:12px;font-weight:500;padding:6px 12px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted);flex:none;display:flex;align-items:center;gap:5px}
.fchip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.fchip .icon{width:13px;height:13px}

/* ── трек дня, серія, реферали ───────────────────── */
.daily{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,
  color-mix(in srgb,var(--accent) 22%,var(--panel)),var(--panel));
  border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:22px}
.daily .art{width:58px;height:58px;border-radius:11px;flex:none;object-fit:cover;background:var(--panel-2)}
.daily .tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--accent);
  text-transform:uppercase;margin-bottom:3px}
.daily .t{font-size:14.5px;font-weight:600}
.daily .s{font-size:12px;color:var(--muted);margin-top:2px}
.daily button{flex:none;width:42px;height:42px;border-radius:99px;background:var(--accent);
  color:var(--accent-ink);display:grid;place-items:center}
.streak{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent);
  padding:4px 10px;border-radius:99px;margin-top:8px}
.refcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.refcard .code{font-family:"Space Grotesk";font-size:20px;font-weight:700;letter-spacing:.04em;
  color:var(--accent);margin:8px 0 2px}
.refcard .row2{display:flex;gap:9px;margin-top:12px}
.refcard .row2 .pill{flex:1;justify-content:center}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}

/* ── queue reorder ───────────────────────────────── */
.qact{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  color:var(--muted)}
.qact:disabled{opacity:.25}
.qact:active{background:var(--panel-2)}
</style>
</head>

function t(key){
  const lang = (S.me && S.me.lang) || "uk";
  return (I18N[lang] && I18N[lang][key]) || I18N.uk[key] || key;
}

function applyI18n(){
  document.querySelectorAll(".nav button").forEach(b=>{
    const key = {Home:"nav_home", Search:"nav_search", Lib:"nav_lib", Me:"nav_me"}[b.dataset.go];
    if(!key) return;
    [...b.childNodes].forEach(n => { if(n.nodeType===3) n.remove(); });
    b.appendChild(document.createTextNode(t(key)));
  });
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  if($("planChip")) $("planChip").textContent = S.me?.premium ? "Premium" : t("premium_free");
  if(S.me) $("topSub").textContent = S.me.premium ? t("sub_premium") : t("sub_free");
}

/* ════════ API ════════ */
async function req(path, opts={}){
  if(!API) throw new Error("Адресу API не передано. Відкрийте плеєр кнопкою в боті.");
  const res = await fetch(API+path, {
    ...opts,
    headers:{ "Content-Type":"application/json",
              "X-Telegram-Init-Data": INIT, ...(opts.headers||{}) },
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok || data.ok === false) throw new Error(data.error || ("Помилка "+res.status));
  return data;
}
const get  = p => req(p);
const post = (p,body) => req(p,{method:"POST",body:JSON.stringify(body||{})});

/* Фон заставки — той самий логотип, що й на платівці (беремо src готового
   <img>, щоб не дублювати важкий base64 ще раз у файлі), розмитий і
   напівпрозорий через CSS (.splashBg), просто щоб екран не був голим
   градієнтом. */
(function initSplashBg(){
  const src = document.querySelector(".vlabel img")?.getAttribute("src");
  const bg = $("splashBg");
  if(src && bg) bg.style.backgroundImage = `url("${src}")`;
})();
let _splashCycleTimer = null, _splashPhraseIdx = 0;
function startSplashShow(lang){
  $("vinylDisc")?.classList.add("spin");
  $("tonearm")?.classList.add("down");
  const l = (I18N[lang] ? lang : null) || (I18N[tg?.initDataUnsafe?.user?.language_code] ? tg.initDataUnsafe.user.language_code : null) || "uk";
  const phrases = (I18N[l] && I18N[l].loading_phrases) || I18N.uk.loading_phrases || [];
  if(!phrases.length) return;
  const el = $("splashText");
  if(!el) return;
  if(_splashCycleTimer) clearInterval(_splashCycleTimer);
  _splashPhraseIdx = 0;
  el.textContent = phrases[0];
  _splashCycleTimer = setInterval(() => {
    _splashPhraseIdx = (_splashPhraseIdx + 1) % phrases.length;
    el.classList.add("fade");
    setTimeout(() => { el.textContent = phrases[_splashPhraseIdx]; el.classList.remove("fade"); }, 220);
  }, 1500);
}
function revealApp(){
  if(_splashCycleTimer){ clearInterval(_splashCycleTimer); _splashCycleTimer = null; }
  const splash = $("splash"), app = $("appRoot");
  app?.classList.add("ready");
  setTimeout(() => splash?.classList.add("hide"), 260);
}
(async function boot(){
  startSplashShow();
  if(!INIT && !API){
    $("homeBody").innerHTML =
      `<div class="empty"><b>Відкрийте через Telegram</b>Плеєр працює всередині бота —
       натисніть «Відкрити плеєр».</div>`;
    revealApp();
    return;
  }
  /* /api/me і дані головної/бібліотеки не залежать одне від одного (авторизація
     йде через INIT, а не через результат /api/me) — тому пускаємо їх одразу
     паралельно, а не одне за одним. Це майже вдвічі скорочує час під заставкою. */
  const dataReady = Promise.all([loadHome(), loadLiked(), loadPlaylists()])
    .catch(()=>{ /* окремі секції самі показують свій стан помилки */ });
  try{
    const me = await get("/api/me");
    S.me = me.user; S.limits = me.limits; S.features = me.features;
    applyTheme(S.me.theme, S.me.accent);
    S.crossfade = S.me.crossfade || 0;
    S.eq = S.me.eq || null;
    $("planChip").textContent = S.me.premium ? "Premium" : "Free";
    $("planChip").classList.toggle("pro", !!S.me.premium);
    applyI18n();
    startSplashShow(S.me.lang);
  }catch(e){
    $("homeBody").innerHTML = `<div class="empty"><b>Не вдалося увійти</b>${esc(e.message)}</div>`;
    await dataReady;
    revealApp();
    return;
  }
  await dataReady;
  handleStartParam();
  revealApp();
})();

   тут може лишитись застарілим, якщо застосунок не перезавантажили.
   Оновлюємо профіль щоразу, коли Mini App знову стає видимим. */
async function refreshMe(){
  try{
    const me = await get("/api/me");
    S.me = me.user; S.limits = me.limits; S.features = me.features;
    $("planChip").textContent = S.me.premium ? "Premium" : t("premium_free");
    $("planChip").classList.toggle("pro", !!S.me.premium);
    applyI18n();
  }catch(e){ /* тихо: наступна спроба підхопить */ }
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") refreshMe();
});
window.addEventListener("focus", refreshMe);
tg?.onEvent?.("activated", refreshMe);

function handleStartParam(){
  if(!START) return;
  const [kind, ...rest] = START.split(":");
  const val = rest.join(":");
  if(kind==="search"){ go("Search"); $("qInput").value=val; runSearch(); }

function go(name){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("sc"+name).classList.add("on");
  document.querySelectorAll(".nav button").forEach(b => {
    const becomesOn = b.dataset.go===name;
    if(becomesOn && !b.classList.contains("on")){
      b.classList.add("bump");
      setTimeout(()=>b.classList.remove("bump"), 400);
    }
    b.classList.toggle("on", becomesOn);
  });
  if(name==="Me"){ refreshMe().then(renderProfile); renderProfile(); }
  if(name==="Lib") renderLibrary();
  if(name==="Search") setTimeout(()=>$("qInput").focus(), 120);
  window.scrollTo(0,0);
}

function rowsHtml(list, ctxKey){
  return `<div class="rows">` + list.map((t,i)=>`
    <div class="row ${current()?.id===t.id?"now":""}" data-i="${i}" data-ctx="${ctxKey}">
      <img class="art" src="${esc(t.cover||"")}" alt="" loading="lazy"
           onerror="this.style.visibility='hidden'">
      <div class="meta">
        <div class="t">${esc(t.title)}</div>
        <div class="s">${esc(t.artist)}${t.duration_str?" · "+esc(t.duration_str):""}${
          t.source_label?" · "+esc(t.source_label):""}</div>
      </div>
      <button class="act" data-menu="${i}">${ICON("kebab")}</button>
    </div>`).join("") + `</div>`;
}

const CTX = {};
function mountRows(el, list, ctxKey){
  CTX[ctxKey] = list;
  el.innerHTML = list.length ? rowsHtml(list, ctxKey)
    : `<div class="empty"><b>Порожньо</b>Тут поки нічого немає.</div>`;

    r.onclick = ev => {

      if(ev.target.dataset.menu !== undefined){ openTrackMenu(CTX[ctxKey][i]); return; }
      setQueue(CTX[ctxKey], i); tap();

function cardsHtml(list, ctxKey, isArtist){

/* ════════ Гра "Вгадай трек" — прибрано з головного екрана на прохання,
   функції лишились нижче невикористаними на випадок, якщо гру захочуть
   повернути. ════════ */
const btAudio = new Audio();
let btTimer = null;
const BT = {pool:[], idx:0, streak:0, perDay:5};

function btTodayCount(){
  const key = "bt_"+today_();
  return +(localStorage.getItem(key) || 0);
}
function btBumpCount(){
  try{
    const key = "bt_"+today_();
    localStorage.setItem(key, btTodayCount()+1);
  }catch(e){}
}
function today_(){ return new Date().toISOString().slice(0,10); }

async function openBlindTest(){
  tap();
  try{
    const d = await get("/api/blindtest");
    BT.perDay = d.rounds_per_day || 5;
    if(BT.perDay < 100000 && btTodayCount() >= BT.perDay){
      showModal(`<h3>Ліміт на сьогодні</h3>
        <div class="empty" style="padding:10px 0">Безкоштовно доступно ${BT.perDay} раундів на день.
        Premium знімає це обмеження.</div>
        <button class="btn" onclick="closeModal()">Гаразд</button>`);
      return;
    }
    BT.pool = shuffleArr(d.tracks.filter(t=>t.title && t.artist));
    BT.idx = 0; BT.streak = 0;
    if(BT.pool.length < 4){ toast("Замало треків для гри, спробуйте пізніше"); return; }
    btRound();
  }catch(e){ toast(e.message); }
}

function shuffleArr(a){ a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function btRound(){
  if(BT.idx >= BT.pool.length){ return btFinish(); }
  const correct = BT.pool[BT.idx];
  const decoysPool = BT.pool.filter((t,i)=>i!==BT.idx);
  const decoys = shuffleArr(decoysPool).slice(0,3);
  const options = shuffleArr([correct, ...decoys]);
  showModal(`
    <h3>Вгадай трек · серія ${BT.streak}</h3>
    <div style="text-align:center;margin:10px 0 18px">
      <button class="pill" id="btPlayBtn" style="justify-content:center;width:100%">
        ${ICON("play","sm")}Прослухати 8 секунд</button>
    </div>
    <div id="btOptions"></div>`);
  $("modalBox").querySelector("#btOptions").innerHTML = options.map((o,i)=>`
    <button class="btn ghost" data-opt="${i}" style="text-align:left;margin-bottom:8px">
      ${esc(o.title)} — ${esc(o.artist)}</button>`).join("");
  $("btPlayBtn").onclick = () => {
    clearTimeout(btTimer);
    btAudio.pause(); btAudio.src = streamUrl(correct); btAudio.currentTime = 0;
    btAudio.play().catch(()=>toast("Не вдалося відтворити фрагмент"));
    btTimer = setTimeout(()=>btAudio.pause(), 8000);
  };
  $("modalBox").querySelectorAll("[data-opt]").forEach(b => b.onclick = () => {
    const picked = options[+b.dataset.opt];
    btAudio.pause(); clearTimeout(btTimer);
    if(picked.id === correct.id){
      BT.streak++; toast("Правильно!");
      $("modalBox").querySelectorAll("[data-opt]").forEach(x=>x.disabled=true);
      b.style.borderColor = "var(--accent)"; b.style.color = "var(--accent)";
      setTimeout(()=>{ BT.idx++; btRound(); }, 700);
    } else {
      b.style.opacity = ".5";
      toast(`Правильна відповідь: ${correct.title} — ${correct.artist}`);
      setTimeout(()=>btFinish(), 900);
    }
  });
}

async function btFinish(){
  btAudio.pause(); clearTimeout(btTimer);
  btBumpCount();
  let topHtml = "";
  try{
    const d = await post("/api/blindtest", {streak: BT.streak});
    topHtml = `<div style="font-size:12px;color:var(--muted);margin:14px 0 6px">Рейтинг</div>` +
      d.top.slice(0,5).map((r,i)=>`<div class="row"><div class="meta">
        <div class="t">${i+1}. ${esc(r.name||"Гравець")}</div></div>
        <div class="s" style="color:var(--accent);font-weight:600">${r.best_streak}</div></div>`).join("");
  }catch(e){ /* рейтинг не критичний */ }
  showModal(`<h3>Гру завершено</h3>
    <div class="empty" style="padding:10px 0"><b>Серія: ${BT.streak}</b>Спробуйте побити свій рекорд</div>
    ${topHtml}
    <button class="btn" style="margin-top:14px" onclick="closeModal()">Закрити</button>
    <button class="btn ghost" onclick="closeModal();openBlindTest()">Зіграти ще</button>`);
}

  `<div class="hint">Каталог складають незалежні артисти з відкритою ліцензією
  (Jamendo, Audius, Internet Archive) — мейнстрім-релізів тут немає за задумом,
  бо їх не можна легально стрімити. Спробуйте жанр або назву гурту.</div>`;

async function runSearch(){
  if(S.kind === "genres") return;
  const q = $("qInput").value.trim();
  if(q.length < 2) return;
  $("qBody").innerHTML = `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
  try{
    if(S.kind === "all"){
      const params = `q=${encodeURIComponent(q)}&type=all&limit=15&sort=${S.sort}`;
      const d = await get(`/api/search?${params}`);
      renderAllResults(d.results);
      return;
    }
    const params = `q=${encodeURIComponent(q)}&type=${S.kind}&limit=40&sort=${S.sort}&sources=${S.sources.join(",")}`;
    const d = await get(`/api/search?${params}`);
    if(!d.results.length){
      // Нічого не знайшли в поточному типі (альбоми/артисти/жанр тощо) —
      // не показуємо порожній екран, а пробуємо ті самі слова серед треків.
      if(S.kind !== "tracks"){
        const fbParams = `q=${encodeURIComponent(q)}&type=tracks&limit=40&sort=${S.sort}&sources=${S.sources.join(",")}`;
        const fb = await get(`/api/search?${fbParams}`).catch(()=>({results:[]}));
        if(fb.results.length){
          $("qBody").innerHTML = `<div class="sect"><h2 data-i18n="search_tracks">Треки</h2></div>`;
          const wrap = document.createElement("div"); $("qBody").appendChild(wrap);
          mountRows(wrap, fb.results, "search_fallback");
          applyI18n();
          return;
        }
      }
      $("qBody").innerHTML = `<div class="empty"><b data-i18n="nothing_found_title">Нічого не знайдено</b><span data-i18n="nothing_found_body">Спробуйте інше слово.</span></div>${NO_RESULTS_HINT}`;
      applyI18n();
      return;
    }
    if(S.kind==="albums" || S.kind==="artists") renderCollections(d.results, S.kind);
    else mountRows($("qBody"), d.results, "search");
    applyI18n();
  }catch(e){
    $("qBody").innerHTML = `<div class="empty"><b data-i18n="nothing_worked_title">Нічого не вийшло</b>${esc(e.message)}</div>`;
    applyI18n();
  }
}

function renderAllResults(r){
  const empty = !r.tracks.length && !r.albums.length && !r.artists.length;
  if(empty){
    $("qBody").innerHTML = `<div class="empty"><b data-i18n="nothing_found_title">Нічого не знайдено</b><span data-i18n="nothing_found_body">Спробуйте інше слово.</span></div>${NO_RESULTS_HINT}`;
    applyI18n();
    return;
  }
  let html = "";
  if(r.tracks.length){ CTX["all_tracks"] = r.tracks;
    html += `<div class="sect"><h2 data-i18n="search_tracks">Треки</h2></div>` + rowsHtml(r.tracks.slice(0,8), "all_tracks"); }
  if(r.albums.length){
    html += `<div class="sect"><h2 data-i18n="search_albums">Альбоми</h2>${cardsHtml(r.albums, "all_albums")}</div>`; }
  if(r.artists.length){
    html += `<div class="sect"><h2 data-i18n="search_artists">Артисти</h2>${cardsHtml(r.artists, "all_artists", true)}</div>`; }
  $("qBody").innerHTML = html;
  applyI18n();
  $("qBody").querySelectorAll(".row").forEach(row=>{
    row.onclick = ev => {
      const list = CTX[row.dataset.ctx], i = +row.dataset.i;
      if(ev.target.dataset.menu !== undefined){ openTrackMenu(list[i]); return; }
      setQueue(list, i); tap();
    };
  });
  $("qBody").querySelectorAll(".card").forEach(c=>{
    c.onclick = async () => {
      const list = CTX[c.dataset.ctx], i = +c.dataset.i;
      tap();
      if(c.dataset.ctx === "all_tracks"){ setQueue(list, i); return; }
      const x = list[i];
      const path = c.dataset.ctx === "all_albums" ? "/api/album/" : "/api/artist/";
      try{
        const d = await get(path + encodeURIComponent(x.id));
        go("Search"); $("qBody").innerHTML = `<div class="sect"><h2>${esc(x.title||x.name)}</h2></div>`;
        const wrap = document.createElement("div"); $("qBody").appendChild(wrap);
        mountRows(wrap, d.tracks, "coll_tracks");
      }catch(e){ toast(e.message); }
    };
  });
}

function renderCollections(list, kind){
  if(!list.length){ $("qBody").innerHTML =
    `<div class="empty"><b data-i18n="nothing_found_title">Нічого не знайдено</b><span data-i18n="nothing_found_body">Спробуйте інше слово.</span></div>`; applyI18n(); return; }
  CTX["coll"] = list;
  $("qBody").innerHTML = `<div class="rows">` + list.map((x,i)=>`
    <div class="row" data-i="${i}">
      <img class="art" src="${esc(x.cover||"")}" alt="" loading="lazy"
           onerror="this.style.visibility='hidden'">
      <div class="meta"><div class="t">${esc(x.title||x.name)}</div>
        <div class="s">${esc(x.artist||x.source_label||"")}</div></div>
      <button class="act">${ICON("chevron-right")}</button>

/* ════════ Черга і відтворення ════════ */
function current(){ return S.index >= 0 ? S.queue[S.index] : null; }

function setQueue(list, index){
  S.queue = list.slice(); S.index = index; play(current());
}

async function playById(id){
  try{ const d = await get("/api/track/"+encodeURIComponent(id)); setQueue([d.track], 0); }
  catch(e){ toast(e.message); }
}

function streamUrl(t){
  return `${API}/api/stream?id=${encodeURIComponent(t.id)}&initData=${encodeURIComponent(INIT)}`;
}

/* «Тихий вечір»: 23:00–07:00 сам м'яко притишує гучність, щоб не будити
   сусідів/рідних — не змінює збережену гучність пристрою, лише верхню межу. */
function nightCap(base){
  return (S.nightQuiet && isNightHours()) ? Math.min(base, 0.55) : base;
}

let fadeTimer = null;
function play(t){
  if(!t) return;
  clearInterval(fadeTimer);
  if(S.crossfade > 0 && S.playing){ crossfadeTo(t); }
  else {
    cur.pause(); cur.src = streamUrl(t); cur.playbackRate = S.speed; cur.volume = nightCap(1);
    cur.play().catch(err => toast("Джерело не віддало потік"));
  }
  S.playing = true;
  paint(t);
  reportPlay(t);
}

function crossfadeTo(t){
  const outgoing = cur, incoming = alt;
  incoming.src = streamUrl(t); incoming.playbackRate = S.speed; incoming.volume = 0;
  incoming.play().catch(()=>{ outgoing.volume=nightCap(1); });
  const steps = 20, ms = (S.crossfade*1000)/steps, cap = nightCap(1);
  let k = 0;
  fadeTimer = setInterval(()=>{
    k++; const r = k/steps;
    incoming.volume = Math.min(cap, r*cap);
    outgoing.volume = Math.max(0, cap-r*cap);
    if(k>=steps){ clearInterval(fadeTimer); outgoing.pause(); outgoing.volume = cap; }
  }, ms);
  cur = incoming; alt = outgoing;
}

function setSpeed(v){
  S.speed = v;
  A.playbackRate = v; B.playbackRate = v;
  try{ localStorage.setItem("mlsp_speed", v); }catch(e){}
  const el = $("speedBtn"); if(el) el.textContent = v+"x";
}

function toggleNightQuiet(){
  S.nightQuiet = !S.nightQuiet;
  try{ localStorage.setItem("mlsp_nightquiet", S.nightQuiet?"1":"0"); }catch(e){}
  const sw = $("swNight"); if(sw) sw.classList.toggle("on", S.nightQuiet);
  if(S.playing) cur.volume = nightCap(cur.volume > 0 ? 1 : 0);
}

function togglePlay(){
  tap();
  if(!current()) return;
  if(cur.paused){ cur.play(); S.playing = true; } else { cur.pause(); S.playing = false; }
  paintPlayState();
}

function nextTrack(auto){
  if(!S.queue.length) return;
  if(S.repeat === "one" && auto){ cur.currentTime = 0; cur.play(); return; }
  let i;
  if(S.shuffle) i = Math.floor(Math.random()*S.queue.length);
  else i = S.index + 1;
  if(i >= S.queue.length){
    if(S.repeat === "all") i = 0;
    else { S.playing = false; paintPlayState(); return; }
  }
  S.index = i; play(current());
}

function prevTrack(){
  if(cur.currentTime > 4){ cur.currentTime = 0; return; }
  S.index = S.index > 0 ? S.index-1 : 0; play(current());
}

/* ── свайп по обкладинці — перегортання треків жестом, як у Spotify ── */
(function initCoverSwipe(){
  const el = $("coverWrap");
  if(!el || !("ontouchstart" in window)) return;
  let sx = 0, sy = 0, dragging = false;
  const reset = (animate) => {
    el.style.transition = animate ? "transform .22s ease, opacity .22s ease" : "none";
    el.style.transform = ""; el.style.opacity = "1";
  };
  el.addEventListener("touchstart", e => {
    if(e.touches.length !== 1 || !current()) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; dragging = true;
    el.style.transition = "none";
  }, {passive:true});
  el.addEventListener("touchmove", e => {
    if(!dragging) return;
    const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if(Math.abs(dx) > Math.abs(dy)){
      el.style.transform = `translateX(${dx*0.6}px) rotate(${dx*0.025}deg)`;
      el.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx)/280));
    }
  }, {passive:true});
  el.addEventListener("touchend", e => {
    if(!dragging) return;
    dragging = false;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) < 64 || Math.abs(dx) < Math.abs(dy)){ reset(true); return; }
    const dir = dx < 0 ? 1 : -1; // вліво = наступний, вправо = попередній
    const hasNext = S.queue.length>0 && (dir<0 || S.shuffle || S.repeat==="all" || S.index+1 < S.queue.length);
    if(dir>0 && !hasNext){ reset(true); return; }
    el.style.transition = "transform .22s ease, opacity .22s ease";
    el.style.transform = `translateX(${dir*360}px) rotate(${dir*14}deg)`;
    el.style.opacity = "0";
    setTimeout(() => {
      tap();
      if(dir>0) nextTrack(); else prevTrack();
      reset(false);
      requestAnimationFrame(() => { el.style.transition = "transform .22s ease, opacity .22s ease"; });
    }, 190);
  });
})();

/* ── подвійний тап по обкладинці — лайк, як в Instagram/Spotify ── */
(function initCoverDoubleTap(){
  const el = $("coverWrap");
  if(!el) return;
  let lastTap = 0;
  el.addEventListener("click", e => {
    const now = Date.now();
    if(now - lastTap < 320){
      const t = current();
      if(t && !S.liked.has(t.id)) toggleLike(); else tap();
      const rect = el.getBoundingClientRect();
      const heart = document.createElement("div");
      heart.className = "heartBurst"; heart.textContent = "❤️";
      heart.style.left = (e.clientX - rect.left) + "px";
      heart.style.top = (e.clientY - rect.top) + "px";
      el.appendChild(heart);
      setTimeout(() => heart.remove(), 750);
    }
    lastTap = now;
  });
})();

/* ── моменти (закладки в треку) ── */
function addBookmark(){
  tap();
  const trk = current(); if(!trk) return;
  const time = cur.currentTime || 0;
  const list = bookmarksAll();
  list.unshift({id:trk.id+":"+Math.round(time*1000), trackId:trk.id, title:trk.title,
    artist:trk.artist, cover:trk.cover, t:time, savedAt:Date.now()});
  bookmarksSave(list);
  toast(t("bookmark_added").replace("{time}", fmt(time)));
  renderBkmkTicks(trk);
}
function renderBkmkTicks(trk){
  const box = $("bkmkTicks"); if(!box) return;
  box.innerHTML = "";
  const d = cur.duration;
  if(!trk || !isFinite(d) || d<=0) return;
  bookmarksAll().filter(b=>b.trackId===trk.id).forEach(b=>{
    const pct = Math.min(100, Math.max(0, (b.t/d)*100));
    const i = document.createElement("i");
    i.style.left = pct+"%"; i.title = fmt(b.t);
    i.onclick = e => { e.stopPropagation(); cur.currentTime = b.t;
      if(cur.paused){ cur.play(); S.playing = true; paintPlayState(); } };
    box.appendChild(i);
  });
}
async function playBookmark(b){
  tap();
  await playById(b.trackId);
  const seekOnce = () => { cur.currentTime = b.t; cur.removeEventListener("loadedmetadata", seekOnce); };
  if(isFinite(cur.duration) && cur.duration>0) cur.currentTime = b.t;
  else cur.addEventListener("loadedmetadata", seekOnce);
  openSheet();
}
function deleteBookmark(id){
  bookmarksSave(bookmarksAll().filter(b=>b.id!==id));
  renderLibrary();
  const t = current(); if(t) renderBkmkTicks(t);
}

/* ════════ Візуалізація стану ════════ */
function paint(t){
  $("bar").classList.add("on");
  $("barArt").src = t.cover || ""; $("npArt").src = t.cover || ""; $("ambientBg").src = t.cover || "";
  applyAmbientStyle();
  $("barTitle").textContent = t.title; $("npTitle").textContent = t.title;
  $("barArtist").textContent = t.artist; $("npArtist").textContent = t.artist;
  $("npLic").innerHTML = `${esc(t.source_label||"")} · ${esc(t.license_short||"")}` +
    (t.source_url ? `<br><a href="${esc(t.source_url)}" target="_blank" rel="noopener">сторінка оригіналу</a>` : "");
  $("pillLike").innerHTML = pillLikeHTML(S.liked.has(t.id));
  $("pillLike").classList.toggle("on", S.liked.has(t.id));
  paintPlayState();
  document.querySelectorAll(".row").forEach(r=>{
    const list = CTX[r.dataset.ctx]; const item = list?.[+r.dataset.i];
    r.classList.toggle("now", item?.id === t.id);
  });
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title:t.title, artist:t.artist, album:t.album||"",
      artwork: t.cover ? [{src:t.cover, sizes:"400x400", type:"image/jpeg"}] : [],
    });
    navigator.mediaSession.setActionHandler("play", togglePlay);
    navigator.mediaSession.setActionHandler("pause", togglePlay);
    navigator.mediaSession.setActionHandler("nexttrack", ()=>nextTrack());
    navigator.mediaSession.setActionHandler("previoustrack", prevTrack);
  }
}

function pillLikeHTML(liked){
  return ICON(liked ? "heart-filled" : "heart") + (liked ? "Збережено" : "Зберегти");
}

function paintPlayState(){
  const playing = S.playing && !cur.paused;
  const name = playing ? "pause" : "play";
  $("barPlay").innerHTML = ICON(name); $("npPlay").innerHTML = ICON(name);
  $("coverWrap").classList.toggle("playing", playing);

/* ── жива обкладинка ── */
function applyAmbientStyle(){
  const style = (S.me && S.me.ambient_style) || "blur";
  const wrap = $("coverWrap");
  wrap.classList.remove("style-blur", "style-vinyl", "style-particles");
  wrap.classList.add("style-"+style);
  wrap.querySelectorAll(".particle").forEach(p=>p.remove());
  if(style === "particles"){
    for(let i=0;i<6;i++){
      const p = document.createElement("div");
      p.className = "particle";
      const size = 14 + Math.random()*22;
      p.style.width = p.style.height = size+"px";
      p.style.left = (Math.random()*90)+"%";
      p.style.top = (Math.random()*90)+"%";
      p.style.animationDelay = (Math.random()*4)+"s";
      p.style.animationDuration = (5+Math.random()*4)+"s";
      wrap.appendChild(p);
    }
  }
}

let seeking = false;
function paintProgress(){
  const d = cur.duration, c = cur.currentTime;
  $("npCur").textContent = fmt(c);
  $("npDur").textContent = isFinite(d) ? fmt(d) : "—";
  const pct = isFinite(d) && d>0 ? (c/d)*100 : 0;
  $("barLine").style.width = pct+"%";
  if(!seeking) $("npSeek").value = Math.round(pct*10);
  if(S.crossfade>0 && isFinite(d) && d-c <= S.crossfade && d>0 && !fadeTimer && S.index+1<S.queue.length){
    S.index++; play(current());
  }
}

$("npSeek").addEventListener("input", ()=>{ seeking = true; });
$("npSeek").addEventListener("change", e=>{
  seeking = false;
  if(isFinite(cur.duration)) cur.currentTime = cur.duration * (e.target.value/1000);
});

function openQueue(){

function renderQueueModal(){
  const box = $("qModal");
  if(!S.queue.length){ box.innerHTML = `<div class="empty"><b>Черга порожня</b></div>`; return; }
  box.innerHTML = S.queue.map((t,i)=>`
    <div class="row ${i===S.index?"now":""}">
      <img class="art" src="${esc(t.cover||"")}" alt="" onerror="this.style.visibility='hidden'">
      <div class="meta"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist)}</div></div>
      <button class="qact" data-up="${i}" ${i===0?"disabled":""}>${ICON("up","sm")}</button>
      <button class="qact" data-down="${i}" ${i===S.queue.length-1?"disabled":""}>${ICON("down","sm")}</button>
      <button class="qact" data-rm="${i}">${ICON("close","sm")}</button>
    </div>`).join("");
  box.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>moveQueue(+b.dataset.up,-1));
  box.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>moveQueue(+b.dataset.down,1));
  box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>removeFromQueue(+b.dataset.rm));
}

function moveQueue(i, dir){
  const j = i+dir; if(j<0||j>=S.queue.length) return;
  [S.queue[i],S.queue[j]] = [S.queue[j],S.queue[i]];
  if(S.index===i) S.index=j; else if(S.index===j) S.index=i;
  renderQueueModal(); tap();
}

function removeFromQueue(i){
  if(i===S.index){ toast("Це поточний трек — спершу перемкніть"); return; }
  S.queue.splice(i,1);
  if(i < S.index) S.index--;
  renderQueueModal(); toast("Прибрано з черги");
}

function buildEqChain(){
  if(S.eqNodes) return true;
  try{
    S.ctx = new (window.AudioContext || window.webkitAudioContext)();
    [A,B].forEach(el => el.crossOrigin = "anonymous");
    const filters = EQ_FREQ.map((f,i)=>{
      const b = S.ctx.createBiquadFilter();
      b.type = i===0 ? "lowshelf" : i===EQ_FREQ.length-1 ? "highshelf" : "peaking";
      b.frequency.value = f; b.Q.value = 1; b.gain.value = 0;
      return b;
    });
    const srcs = [A,B].map(el => S.ctx.createMediaElementSource(el));
    srcs.forEach(s => {
      let node = s;
      filters.forEach(f => { node.connect(f); node = f; });
    });
    filters[filters.length-1].connect(S.ctx.destination);
    S.eqNodes = filters;
    return true;
  }catch(e){
    console.warn("EQ недоступний:", e);
    [A,B].forEach(el => el.crossOrigin = null);
    return false;
  }
}

function applyEq(){
  if(!S.eq) return;
  if(!buildEqChain()){ toast("Це джерело не дозволяє обробку звуку"); return; }
  S.ctx.resume?.();
  S.eqNodes.forEach((f,i) => f.gain.value = S.eq[i] || 0);
}

function disableEq(){ if(S.eqNodes) S.eqNodes.forEach(f => f.gain.value = 0); }

        </div>

          <b style="font-size:17px">${esc(top)}</b></div>
        ${track?`<div style="margin-top:10px;font-size:14px">Улюблений трек<br>
          <b style="font-size:17px">${esc(track.title)}</b> — ${esc(track.artist)}</div>`:""}
      </div>
      <button class="pill" style="width:100%;justify-content:center" onclick="shareWrapped('${esc(d.listener_type)}','${esc(top)}',${s.hours})">
        ${ICON("share","sm")}Поділитися</button>`;
  }catch(e){ toast(e.message); }
}

function shareWrapped(type, artist, hours){
  tap();
  const text = `Мій тип слухача в MusicLSP — ${type}! ${hours} год музики цього року, улюблений артист — ${artist}.`;
  try{ tg?.openTelegramLink?.(`https://t.me/share/url?url=&text=${encodeURIComponent(text)}`); }
  catch(e){ toast(text); }
}

function openPromo(){
  showModal(`<h3>Промокод</h3>
    <input class="field" id="promoInput" placeholder="Наприклад LAUNCH30" autocapitalize="characters">
    <button class="btn" onclick="redeem()">Активувати</button>`);
}

async function redeem(){
  try{
    const d = await post("/api/promo", {code: $("promoInput").value.trim()});
    closeModal(); toast(`Premium на ${d.days} днів активовано`);
    const me = await get("/api/me"); S.me = me.user; S.limits = me.limits;
    $("planChip").textContent = "Premium"; $("planChip").classList.add("pro");
    renderProfile();
  }catch(e){ toast(e.message); }
}

/* ════════ Модалка ════════ */
function showModal(html){ $("modalBox").innerHTML = html; $("modal").classList.add("on"); }
function closeModal(){ $("modal").classList.remove("on"); }
tg?.BackButton?.onClick(()=>{
  if($("modal").classList.contains("on")) return closeModal();
  if($("sheet").classList.contains("on")) return closeSheet();
  tg.close();
});
tg?.BackButton?.show?.();

paintStaticIcons();
</script>
</body>
</html>
